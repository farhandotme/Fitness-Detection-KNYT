server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # This is a client-side SPA (wouter router) - any path that isn't a real
    # file must fall back to index.html or refreshing on e.g. /events/:id
    # returns a raw 404 from nginx instead of letting React render it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets (dist/public/assets/*) can be cached forever since
    # their filename changes whenever the content does.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html itself must never be cached, or deploys won't show up for
    # returning visitors until the cache expires.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=()" always;

    location ~ /\. {
        deny all;
    }
}
